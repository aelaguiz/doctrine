schema_version = 1
default_prompt = "prompts/AGENTS.prompt"

[[cases]]
name = "details land beside the home that owns them"
status = "active"
kind = "cli_contract"
project = "project"
args = ["build", "."]
expected_exit = 0
stdout_contains = [
  "built 2 homes",
]
expected_file_lines = { "pods/growth/AGENTS.md" = [
    "## When to wait",
    "",
    "Wait only when what you wait for could change what you'd do.",
    "",
    "Fuller cases, under the same headings: [DETAILS.md](DETAILS.md).",
], "pods/growth/DETAILS.md" = [
    "## When to wait",
    "",
    "On October 13 a watcher moved a member mid test pass.",
], "pods/growth/qa/AGENTS.md" = [
    "You test.",
    "",
    "## How you think",
    "",
    "**A test plan.** Grow it with the design.",
    "",
    "Fuller cases, under the same headings: [DETAILS.md](DETAILS.md).",
], "pods/growth/qa/DETAILS.md" = [
    "## How you think",
    "",
    "### Older cases",
    "",
    "November 5: the long case.",
] }

[[cases]]
name = "a sibling SOUL.prompt cannot hold details"
status = "active"
kind = "cli_contract"
project = "project_soul_details"
args = ["build", "--target", "homes"]
expected_exit = 1
stderr_contains = [
  "E620 compile error: Details not allowed here",
  "`details` can't be used in `SOUL.prompt`.",
]

[[cases]]
name = "shared cases use each team's words"
status = "active"
kind = "cli_contract"
project = "project_team_words"
args = ["build", "."]
expected_exit = 0
expected_file_lines = { "alpha/qa/DETAILS.md" = [
    "## Test the bet",
    "",
    "### A case",
    "",
    "The heading uses the team's word.",
    "",
    "## More cases",
    "",
    "### A bet case",
    "",
    "The title uses the team's word.",
    "",
    "### The team",
    "",
    "#### Members",
    "",
    "| Who |",
    "| --- |",
    "| Alpha QA |",
], "beta/qa/DETAILS.md" = [
    "## Test the feature",
    "",
    "### A case",
    "",
    "The heading uses the team's word.",
    "",
    "## More cases",
    "",
    "### A feature case",
    "",
    "The title uses the team's word.",
    "",
    "### The team",
    "",
    "#### Members",
    "",
    "| Who |",
    "| --- |",
    "| Beta QA |",
], "_details/qa.md" = [
    "## More cases",
    "",
    "### A common case",
    "",
    "Every team can use this.",
] }

[[cases]]
name = "a member adds replaces keeps and drops cases"
status = "active"
kind = "cli_contract"
project = "project_case_patches"
args = ["build", "."]
expected_exit = 0
stdout_contains = ["built 4 homes"]
expected_file_lines = { "team/added/DETAILS.md" = [
  "## How to test", "", "### Local case", "", "This team owns the case.",
], "team/replaced/DETAILS.md" = [
  "## How to test", "", "### New case", "", "The new case.",
], "_details/qa.md" = [
  "## How to test", "", "### Earlier case", "", "The older case.",
] }
absent_files = ["team/dropped/DETAILS.md"]

[[cases]]
name = "load gives the reason a case was dropped"
status = "active"
kind = "cli_contract"
project = "project_case_patches"
args = ["load", "T.dropped"]
expected_exit = 0
stdout_contains = ["work.plan.older from T.dropped: This case no longer fits."]

[[cases]]
name = "diff shows a dropped case"
status = "active"
kind = "cli_contract"
project = "project_case_patches"
args = ["diff", "--base-tree", "base", "--json"]
expected_exit = 0
stdout_contains = ['"T.dropped"', '"team/dropped"', '"path": ["work", "plan", "older"]', '"status": "removed"']

[[cases]]
name = "a case path needs a parent"
status = "active"
kind = "cli_contract"
project = "project_case_missing"
args = ["build", "."]
expected_exit = 1
stderr_contains = ["E610", "`T.qa` patches `work.absent.case`, but its parent has no such key."]

[[cases]]
name = "a case path cannot repeat a key"
status = "active"
kind = "cli_contract"
project = "project_case_duplicate"
args = ["build", "."]
expected_exit = 1
stderr_contains = ["E612", "`T.qa` adds the case `work.older`, which it already has. Write `override work.older` to replace it."]
