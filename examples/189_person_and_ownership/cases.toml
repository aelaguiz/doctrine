schema_version = 1
default_prompt = "prompts/AGENTS.prompt"

[[cases]]
name = "a changed owned declaration is listed"
status = "active"
kind = "cli_contract"
project = "project"
args = ["diff", "--base-tree", "base"]
expected_exit = 0
expected_stdout_lines = [
  "1 declaration changed. 1 home changed.",
  "",
  "EveryAgent (prompts/AGENTS.prompt) reaches 1 home, +9 characters:",
  "  .",
  "",
  "Owned declarations changed:",
  "  EveryAgent, owned by Owner",
]

[[cases]]
name = "an owned ref that does not resolve fails loud"
status = "active"
kind = "cli_contract"
project = "project_bad_owner"
args = ["check"]
expected_exit = 1
stderr_contains = [
  "E651",
  "NoSuchThing",
]
