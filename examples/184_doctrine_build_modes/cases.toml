schema_version = 1
default_prompt = "prompts/AGENTS.prompt"

[[cases]]
name = "only a titled plain agent gets a scope line"
status = "active"
kind = "cli_contract"
project = "project_titled"
args = ["build", ".", "--target", "homes"]
expected_exit = 0
expected_file_lines = { "writer/AGENTS.md" = ["If your session started in this folder, you are the writer. If not, this only describes that role.", "", "Write clearly."], "reader/AGENTS.md" = ["Read closely."] }

[[cases]]
name = "a plain agent builds a Claude-only home"
status = "active"
kind = "cli_contract"
project = "project_plain_agent"
args = ["build", "--target", "claude"]
expected_exit = 0
expected_file_lines = { "solo/CLAUDE.md" = ["Work alone."] }
absent_files = ["solo/AGENTS.md"]

[[cases]]
name = "a plain agent builds a home for both runtimes"
status = "active"
kind = "cli_contract"
project = "project_plain_agent"
args = ["build", "--target", "both"]
expected_exit = 0
expected_file_lines = { "solo/AGENTS.md" = ["Work alone."] }
expected_links = { "solo/CLAUDE.md" = "AGENTS.md" }

[[cases]]
name = "a Claude-only plain agent counts its file"
status = "active"
kind = "cli_contract"
project = "project_plain_agent"
args = ["load", "solo", "--target", "claude", "--runtime", "claude"]
setup = [["build", "--target", "claude"]]
expected_exit = 0
stdout_contains = ["solo on claude: 124 of 150,000 characters", "solo/CLAUDE.md  124"]

[[cases]]
name = "a plain agent counts its file on both runtimes"
status = "active"
kind = "cli_contract"
project = "project_plain_agent"
args = ["load", "solo", "--target", "both"]
setup = [["build", "--target", "both"]]
expected_exit = 0
stdout_contains = ["solo on claude: 124 of 150,000 characters", "solo on codex: 124 of 32,768 bytes", "solo/AGENTS.md  124"]

[[cases]]
name = "a selected build fails on a stale parent"
status = "active"
kind = "cli_contract"
project = "project"
args = ["build", "pods/growth/qa"]
expected_exit = 1
setup = [["build", "."]]
edit = { "prompts/AGENTS.prompt" = "team GrowthPod: \"the growth pod\"\n    home: \"pods/growth\"\n    role: \"Team text changed.\"\n    member qa: \"QA\"\n        role: \"QA text changed.\"\n    member analyst: \"analyst\"\n        role: \"Analyst text.\"\n" }
stderr_contains = [
  "E635",
  "pods/growth/AGENTS.md",
]
expected_file_lines = { "pods/growth/qa/AGENTS.md" = [
    "If your session started in this folder, you are the growth pod's QA. If not, this only describes that role.",
    "",
    "QA text.",
], "pods/growth/AGENTS.md" = [
    "This file loads for every session started under `pods/growth/`. If yours started there, you are a member of the growth pod. If not, it only describes them.",
    "",
    "Team text.",
] }

[[cases]]
name = "check mode reports stale files and writes nothing"
status = "active"
kind = "cli_contract"
project = "project"
args = ["check", "."]
expected_exit = 1
setup = [["build", "."]]
edit = { "prompts/AGENTS.prompt" = "team GrowthPod: \"the growth pod\"\n    home: \"pods/growth\"\n    role: \"Team text changed.\"\n    member qa: \"QA\"\n        role: \"QA text changed.\"\n    member analyst: \"analyst\"\n        role: \"Analyst text.\"\n" }
stderr_contains = [
  "stale pods/growth/AGENTS.md",
  "stale pods/growth/qa/AGENTS.md",
]
expected_file_lines = { "pods/growth/qa/AGENTS.md" = [
    "If your session started in this folder, you are the growth pod's QA. If not, this only describes that role.",
    "",
    "QA text.",
] }

[[cases]]
name = "check mode is clean on a fresh tree"
status = "active"
kind = "cli_contract"
project = "project"
args = ["check", "."]
expected_exit = 0
setup = [["build", "."]]

[[cases]]
name = "a hand edit stops the build and names the file"
status = "active"
kind = "cli_contract"
project = "project"
args = ["build", "."]
expected_exit = 1
setup = [["build", "."]]
edit = { "pods/growth/qa/AGENTS.md" = "<!-- doctrine sha256=000000000000 source=prompts/AGENTS.prompt. Do not edit. Run: doctrine where \"<words>\" -->\n\nA hand edit.\n" }
stderr_contains = [
  "E634",
  "pods/growth/qa/AGENTS.md",
]

[[cases]]
name = "check mode labels a hand edit"
status = "active"
kind = "cli_contract"
project = "project"
args = ["check", "."]
expected_exit = 1
