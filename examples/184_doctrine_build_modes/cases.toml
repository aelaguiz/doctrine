[[cases]]
name = "check mode names a file no home writes any more"
status = "active"
kind = "cli_contract"
project = "project"
args = ["build", ".", "--check"]
expected_exit = 1
setup = [["build", "."]]
edit = { "prompts/AGENTS.prompt" = "team GrowthPod: \"the growth pod\"\n    home: \"pods/growth\"\n    role: \"Team text.\"\n    member qa: \"QA\"\n        role: \"QA text.\"\n" }
stdout_contains = [
