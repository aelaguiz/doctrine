status = "active"
kind = "render_contract"
agent = "GrowthQa"
assertion = "exact_lines"
expected_lines = [
  "You test each bet.",
  "",
  "## Whom you work with",
  "",
  "You follow the opportunity's card from the design on.",
  "",
  "The analyst tells you what the bet measures.",
  "",
  "## Your handle is qa-bet",
  "",
  "Use it everywhere.",
]

