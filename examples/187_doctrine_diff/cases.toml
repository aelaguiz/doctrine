schema_version = 1
default_prompt = "prompts/AGENTS.prompt"

[[cases]]
name = "diff names the cause and the reach"
status = "active"
kind = "cli_contract"
project = "project"
args = ["diff", "--base-tree", "base"]
expected_exit = 0
expected_stdout_lines = [
  "1 declaration changed. 2 homes changed.",
  "",
  "PodQa (prompts/AGENTS.prompt) reaches 2 homes, +8 characters each:",
  "  pods/feature/qa, pods/growth/qa",
]

[[cases]]
name = "where finds the source of a sentence and its reach"
status = "active"
kind = "cli_contract"
project = "project"
args = ["where", "You follow the bet"]
expected_exit = 0
expected_stdout_lines = [
  "PodQa.whom  prompts/AGENTS.prompt:3",
  "  reaches 1 home: pods/growth/qa",
]

[[cases]]
name = "where finds the value before the sentence that reads it"
status = "active"
kind = "cli_contract"
project = "project"
args = ["where", "bet"]
expected_exit = 0
expected_stdout_lines = [
  "value unit  prompts/AGENTS.prompt:10",
  "  reaches 1 home: pods/growth/qa",
  "PodQa.whom  prompts/AGENTS.prompt:3",
  "  reaches 1 home: pods/growth/qa",
]

[[cases]]
name = "where fails when nothing matches"
status = "active"
kind = "cli_contract"
project = "project"
args = ["where", "No such words"]
expected_exit = 1
expected_stdout_lines = []

[[cases]]
name = "each declaration has its own share"
status = "active"
kind = "cli_contract"
project = "project_shares"
args = ["diff", "--base-tree", "base"]
expected_exit = 0
expected_stdout_lines = [
  "2 declarations changed. 3 homes changed.",
  "",
  "Numbers (prompts/AGENTS.prompt) reaches 3 homes, +9 characters each:",
  "  ., pod, pod/qa",
  "",
  "Qa (prompts/AGENTS.prompt) reaches 1 home, +3 characters:",
  "  pod/qa",
  "",
  "Each home: +9 to +12 characters",
]

[[cases]]
name = "a team value has reach without its own text"
status = "active"
kind = "cli_contract"
project = "project_value"
args = ["diff", "--base-tree", "base"]
expected_exit = 0
expected_stdout_lines = [
  "1 declaration changed. 1 home changed.",
  "",
  "Pod (prompts/AGENTS.prompt) reaches 1 home:",
  "  pod/qa",
]

[[cases]]
name = "a declaration has a share in only some homes"
status = "active"
kind = "cli_contract"
project = "project_partial"
args = ["diff", "--base-tree", "base"]
expected_exit = 0
expected_stdout_lines = [
  "2 declarations changed. 3 homes changed.",
  "",
  "Pod.c (prompts/AGENTS.prompt) reaches 1 home, +5 characters:",
  "  pod/c",
  "",
  "Qa (prompts/AGENTS.prompt) reaches 3 homes, +1 to +4 characters in 2:",
  "  pod/a, pod/b, pod/c",
  "",
  "Each home: +1 to +5 characters",
]
