[[cases]]
name = "tree with missing parent"
status = "active"
kind = "cli_contract"
project = "."
args = ["classes"]
expected_exit = 0
edit = { "prompts/AGENTS.prompt" = "workflow Craft: \"Craft\"\n    \"Test {{team:unit}} for {{team:audience}}.\"\n\nabstract agent QA: \"How QA works on every team\"\n    role: \"Test {{agent:subject}}.\"\n    values:\n        subject: \"{{team:unit}}\"\n    testing: Craft\n    abstract policy: AccuracyPolicy\n\nabstract agent WebQA[QA]: \"How web QA works\"\n    inherit *\n    policy: AccuracyPolicy\n\nabstract agent AppQA[QA]: \"How app QA works\"\n    inherit *\n    policy: AccuracyPolicy\n\nabstract team Pod: \"A team that ships work\"\n    abstract win\n\nteam Growth[Pod]: \"growth\"\n    home: \"pods/growth\"\n    win: \"Win\"\n        \"Grow.\"\n    values:\n        unit: \"bet\"\n        audience: \"new users\"\n    member qa[WebQA]: \"QA\"\n\nteam Feature[Pod]: \"feature\"\n    home: \"pods/feature\"\n    win: \"Win\"\n        \"Ship.\"\n    values:\n        unit: \"feature\"\n        audience: \"players\"\n    member qa[AppQA]: \"QA\"\n\nteam Product[Pod]: \"product\"\n    home: \"pods/product\"\n    win: \"Win\"\n        \"Improve.\"\n    values:\n        unit: \"change\"\n        audience: \"players\"\n    member qa[WebQA]: \"QA\"\n        override testing: \"Testing\"\n            \"Test the change twice.\"\n\ndocument AccuracyPolicy: \"Accuracy Policy\"\n    section summary: \"Summary\"\n        \"Check the facts.\"\n\nteam Broken[Missing]: \"broken\"\n    home: \"bad\"\n    member qa: \"QA\"\n        role: \"Test.\"\n" }
expected_stdout_lines = [
  "Agents",
  "QA  (abstract)  uses Craft  abstract policy",
  "├── AppQA  (abstract)",
  "│   └── Feature.qa  pods/feature/qa",
  "└── WebQA  (abstract)",
  "    ├── Growth.qa  pods/growth/qa",
  "    └── Product.qa  pods/product/qa  overrides testing",
  "",
  "Teams",
  "Broken  bad  members qa parent Missing not found",
  "Pod  (abstract)  abstract win",
  "├── Feature  pods/feature  members qa",
  "├── Growth  pods/growth  members qa",
  "└── Product  pods/product  members qa",
]

[[cases]]
name = "tree with cycle"
status = "active"
kind = "cli_contract"
project = "."
args = ["classes"]
expected_exit = 0
edit = { "prompts/AGENTS.prompt" = "workflow Craft: \"Craft\"\n    \"Test {{team:unit}} for {{team:audience}}.\"\n\nabstract agent QA: \"How QA works on every team\"\n    role: \"Test {{agent:subject}}.\"\n    values:\n        subject: \"{{team:unit}}\"\n    testing: Craft\n    abstract policy: AccuracyPolicy\n\nabstract agent WebQA[QA]: \"How web QA works\"\n    inherit *\n    policy: AccuracyPolicy\n\nabstract agent AppQA[QA]: \"How app QA works\"\n    inherit *\n    policy: AccuracyPolicy\n\nabstract team Pod: \"A team that ships work\"\n    abstract win\n\nteam Growth[Pod]: \"growth\"\n    home: \"pods/growth\"\n    win: \"Win\"\n        \"Grow.\"\n    values:\n        unit: \"bet\"\n        audience: \"new users\"\n    member qa[WebQA]: \"QA\"\n\nteam Feature[Pod]: \"feature\"\n    home: \"pods/feature\"\n    win: \"Win\"\n        \"Ship.\"\n    values:\n        unit: \"feature\"\n        audience: \"players\"\n    member qa[AppQA]: \"QA\"\n\nteam Product[Pod]: \"product\"\n    home: \"pods/product\"\n    win: \"Win\"\n        \"Improve.\"\n    values:\n        unit: \"change\"\n        audience: \"players\"\n    member qa[WebQA]: \"QA\"\n        override testing: \"Testing\"\n            \"Test the change twice.\"\n\ndocument AccuracyPolicy: \"Accuracy Policy\"\n    section summary: \"Summary\"\n        \"Check the facts.\"\n\nabstract agent First[Second]:\n    role: \"First.\"\nabstract agent Second[First]:\n    role: \"Second.\"\n" }
expected_stdout_lines = [
  "Agents",
  "First  (abstract) parent Second makes a cycle",
  "QA  (abstract)  uses Craft  abstract policy",
  "├── AppQA  (abstract)",
  "│   └── Feature.qa  pods/feature/qa",
  "└── WebQA  (abstract)",
  "    ├── Growth.qa  pods/growth/qa",
  "    └── Product.qa  pods/product/qa  overrides testing",
  "Second  (abstract) parent First makes a cycle",
  "",
  "Teams",
  "Pod  (abstract)  abstract win",
  "├── Feature  pods/feature  members qa",
  "├── Growth  pods/growth  members qa",
  "└── Product  pods/product  members qa",
]
