schema_version = 1
default_prompt = "project/prompts/AGENTS.prompt"

[[cases]]
name = "a raw link fails the build"
status = "active"
kind = "cli_contract"
project = "project"
args = ["build", "."]
expected_exit = 1
stderr_contains = ["E638", "team/AGENTS.md links ../notes/runbook.md", "Build it from source, or name its kind in [tool.doctrine.check] reference."]

[[cases]]
name = "a raw link fails check"
status = "active"
kind = "cli_contract"
project = "project"
args = ["check"]
expected_exit = 1
stderr_contains = ["E638", "../notes/runbook.md"]

[[cases]]
name = "reference by notes/"
status = "active"
kind = "cli_contract"
project = "project"
args = ["build", "."]
expected_exit = 0
edit = { "pyproject.toml" = "[[tool.doctrine.emit.targets]]\nname = \"homes\"\nentrypoint = \"prompts/AGENTS.prompt\"\noutput_dir = \".\"\nskills = { source = \"prompts/skills\", install = \".skills\" }\n\n[tool.doctrine.check]\nraw_links = \"error\"\nreference = [\"notes/\"]\n" }
stderr_not_contains = ["W310"]

