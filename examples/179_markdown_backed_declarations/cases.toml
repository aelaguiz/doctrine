schema_version = 1
default_prompt = "prompts/AGENTS.prompt"

[[cases]]
name = "missing fails loud"
status = "active"
kind = "compile_fail"
prompt = "prompts/invalid_missing/AGENTS.prompt"
agent = "A"
exception_type = "CompileError"
error_code = "E652"
location_line = 1

