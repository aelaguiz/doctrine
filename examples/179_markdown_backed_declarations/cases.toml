[[cases]]
name = "Markdown headings patch like keyed sections"
status = "active"
kind = "render_contract"
agent = "PodQa"
assertion = "exact_lines"
expected_lines = [
  "You are the pod's QA.",
  "",
  "## Your craft",
  "",
  "Test what users meet.",
  "",
  "### Sending it back",
  "",
  "A failure goes to whoever built the change.",
]

[[cases]]
name = "a Markdown workflow composes, and its keys are checked refs"
status = "active"
kind = "render_contract"
agent = "Reader"
assertion = "exact_lines"
expected_lines = [
  "See Whose call it is.",
  "",
  "## What every agent follows",
  "",
  "Read before you act.",
  "",
  "### Whose call it is",
  "",
  "Ask when a call is not yours.",
]

[[cases]]
name = "a relative link follows the text to its home"
status = "active"
kind = "cli_contract"
project = "project_links"
args = ["build", "."]
expected_exit = 0
expected_file_lines = { "pods/growth/qa/AGENTS.md" = [
    "You test what users meet.",
    "",
    "## Older work",
    "",
    "See [older cases](../../../specialists/qa/cases.md), [the shared notes](../../../specialists/notes.md#today), [the site](https://example.com), and [more][more].",
    "",
    "Code stays as written: `cases.md` and `[older cases](cases.md)`.",
    "",
    "[more]: ../../../specialists/qa/more.md",
] }
