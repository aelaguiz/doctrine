[[cases]]
name = "Markdown headings patch like keyed sections"
status = "active"
kind = "render_contract"
agent = "PodQa"
assertion = "exact_lines"
expected_lines = [
  "You are the pod's QA.",
  "",
  "## Your craft",
  "",
  "Test what users meet.",
  "",
  "### Sending it back",
  "",
  "A failure goes to whoever built the change.",
]

[[cases]]
name = "a Markdown workflow composes, and its keys are checked refs"
status = "active"
kind = "render_contract"
agent = "Reader"
assertion = "exact_lines"
expected_lines = [
  "See Whose call it is.",
  "",
  "## What every agent follows",
  "",
  "Read before you act.",
  "",
  "### Whose call it is",
  "",
  "Ask when a call is not yours.",
]

[[cases]]
name = "drop a paragraph from a Markdown opening"
status = "active"
kind = "render_contract"
agent = "OtherQa"
assertion = "exact_lines"
expected_lines = ["Phones are in the device guide."]
