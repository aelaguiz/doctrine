schema_version = 1
default_prompt = "prompts/AGENTS.prompt"

[[cases]]
name = "a plain child patches role paragraphs"
status = "active"
kind = "render_contract"
agent = "OtherQa"
assertion = "exact_lines"
expected_lines = ["Phones are with the field guide."]

[[cases]]
name = "a member patches role paragraphs"
status = "active"
kind = "render_contract"
agent = "Pod.qa"
assertion = "exact_lines"
expected_lines = ["Phones are with the field guide."]

[[cases]]
name = "inherit keeps the whole role"
status = "active"
kind = "render_contract"
agent = "AllQa"
assertion = "exact_lines"
expected_lines = ["**Who you are.** You are on the core team.", "", "Phones are in the device guide."]

[[cases]]
name = "a scalar replaces the whole role"
status = "active"
kind = "render_contract"
agent = "NewQa"
assertion = "exact_lines"
expected_lines = ["You test the app."]

[[cases]]
name = "a missing role paragraph fails"
status = "active"
kind = "compile_fail"
prompt = "prompts/invalid/AGENTS.prompt"
agent = "OtherQa"
exception_type = "CompileError"
error_code = "E610"
location_line = 7

[[cases]]
name = "a child adds a paragraph before inherited paragraphs"
status = "active"
kind = "render_contract"
agent = "AddedQa"
assertion = "exact_lines"
expected_lines = ["You test the app.", "", "**Who you are.** You are on the core team.", "", "Phones are in the device guide."]

[[cases]]
name = "a child orders inherited paragraphs"
status = "active"
kind = "render_contract"
agent = "OrderedQa"
assertion = "exact_lines"
expected_lines = ["Phones are in the device guide.", "", "You test the app.", "", "**Who you are.** You are on the core team."]

[[cases]]
name = "a child overrides a paragraph with super"
status = "active"
kind = "render_contract"
agent = "ExtendedQa"
assertion = "exact_lines"
expected_lines = ["Check the guide.", "", "Phones are in the device guide.", "", "**Who you are.** You are on the core team."]

[[cases]]
name = "a member adds a paragraph"
status = "active"
kind = "render_contract"
agent = "NewPod.qa"
assertion = "exact_lines"
expected_lines = ["You test the app.", "", "**Who you are.** You are on the core team.", "", "Phones are in the device guide."]

