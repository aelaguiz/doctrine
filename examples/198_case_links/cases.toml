[[cases]]
name = "an unlinked case keeps its companion pointer"
status = "active"
kind = "cli_contract"
project = "project"
edit = { "prompts/AGENTS.prompt" = "file Testing: \"How we test\"\n    path: \"shared/testing.md\"\n    section plans: \"Writing a test plan\"\n        \"Start from what the design promises.\"\n        section review: \"Reviewing the plan\"\n            \"Check the plan.\"\n\nabstract agent Lead:\n    role: \"Lead the work.\"\n    checkins: \"Morning check-ins\"\n        \"At your first tick, read {{details:checkins.reading_answers}}.\"\n        details reading_answers: \"Reading the answers\"\n            \"Take each answer in turn.\"\n        details more: \"More\"\n            \"More cases.\"\n    local: \"Local work\"\n        \"Before work, read {{details:local.plan}}.\"\n        details plan: \"Plan the {{team:unit}}\"\n            \"Use the team's words.\"\n    testing: \"Testing\"\n        \"Before planning, read {{Testing:plans}}. The title is {{Testing:plans.title}}.\"\n\nteam Growth: \"Growth\"\n    home: \"pods/growth\"\n    values:\n        unit: \"feature\"\n    member lead[Lead]: \"Lead\"\n\nteam Deep: \"Deep\"\n    home: \"pods/growth/deep\"\n    values:\n        unit: \"release\"\n    member lead[Lead]: \"Lead\"\n" }
args = ["build", "."]
expected_exit = 0
expected_file_lines = { "pods/growth/lead/AGENTS.md" = ["If your session started in this folder, you are Growth's Lead. If not, this only describes that role.", "", "Lead the work.", "", "## Morning check-ins", "", "At your first tick, read [Reading the answers](../../../_details/lead.md#reading-the-answers).", "", "## Local work", "", "Before work, read [Plan the feature](DETAILS.md#plan-the-feature).", "", "## Testing", "", "Before planning, read [Writing a test plan](../../../shared/testing.md#writing-a-test-plan). The title is Writing a test plan.", "", "Fuller cases, under the same headings: [_details/lead.md](../../../_details/lead.md)."] }

