schema_version = 1
default_prompt = "project/prompts/AGENTS.prompt"

[[cases]]
name = "shared and local cases link at two depths"
status = "active"
kind = "cli_contract"
project = "project"
args = ["build", "."]
expected_exit = 0
expected_file_lines = { "pods/growth/lead/AGENTS.md" = ["If your session started in this folder, you are Growth's Lead. If not, this only describes that role.", "", "Lead the work.", "", "## Morning check-ins", "", "At your first tick, read [Reading the answers](../../../_details/lead.md#reading-the-answers).", "", "## Local work", "", "Before work, read [Plan the feature](DETAILS.md#plan-the-feature).", "", "## Testing", "", "Before planning, read [Writing a test plan](../../../shared/testing.md#writing-a-test-plan). The title is Writing a test plan."], "pods/growth/deep/lead/AGENTS.md" = ["If your session started in this folder, you are Deep's Lead. If not, this only describes that role.", "", "Lead the work.", "", "## Morning check-ins", "", "At your first tick, read [Reading the answers](../../../../_details/lead.md#reading-the-answers).", "", "## Local work", "", "Before work, read [Plan the release](DETAILS.md#plan-the-release).", "", "## Testing", "", "Before planning, read [Writing a test plan](../../../../shared/testing.md#writing-a-test-plan). The title is Writing a test plan."] }

[[cases]]
name = "load lists linked companions"
status = "active"
kind = "cli_contract"
project = "project"
args = ["load", "pods/growth/lead", "--runtime", "codex"]
expected_exit = 0
stdout_contains = ["On demand:", "_details/lead.md", "pods/growth/lead/DETAILS.md", "shared/testing.md"]

[[cases]]
name = "case override follows its title"
status = "active"
kind = "cli_contract"
project = "project"
edit = { "prompts/AGENTS.prompt" = "abstract agent Base:\n    role: \"Test.\"\n    work: \"Work\"\n        \"Read {{details:work.case}}.\"\n        details case: \"Old title\"\n            \"Old case.\"\nabstract agent Child[Base]:\n    inherit *\n    override work.case: \"New title\"\n        \"New case.\"\nteam T: \"Team\"\n    home: \"t\"\n    member qa[Child]: \"QA\"\n" }
args = ["build", "."]
expected_exit = 0
expected_file_lines = { "t/qa/AGENTS.md" = ["If your session started in this folder, you are Team's QA. If not, this only describes that role.", "", "Test.", "", "## Work", "", "Read [New title](../../_details/child.md#new-title)."] }

[[cases]]
name = "a dropped case leaves a dead link"
status = "active"
kind = "cli_contract"
project = "project"
edit = { "prompts/AGENTS.prompt" = "abstract agent Base:\n    role: \"Test.\"\n    work: \"Work\"\n        \"Read {{details:work.case}}.\"\n        details case: \"Old title\"\n            \"Old case.\"\nabstract agent Child[Base]:\n    inherit *\n    drop work.case: \"No longer needed.\"\nteam T: \"Team\"\n    home: \"t\"\n    member qa[Child]: \"QA\"\n" }
args = ["build", "."]
expected_exit = 1
stderr_contains = ["E637", "`t/qa` links to `details:work.case`, which it doesn't have.", "Override the sentence that links to it, or keep the case."]

[[cases]]
name = "overriding the sentence clears the dropped case"
status = "active"
kind = "cli_contract"
project = "project"
edit = { "prompts/AGENTS.prompt" = "abstract agent Base:\n    role: \"Test.\"\n    work: \"Work\"\n        \"Read {{details:work.case}}.\"\n        details case: \"Old title\"\n            \"Old case.\"\nabstract agent Child[Base]:\n    inherit *\n    override work:\n        \"No case needed.\"\n    drop work.case: \"No longer needed.\"\nteam T: \"Team\"\n    home: \"t\"\n    member qa[Child]: \"QA\"\n" }
args = ["build", "."]
expected_exit = 0

