[[cases]]
name = "repeated cases across homes fail the full build"
status = "active"
kind = "cli_contract"
project = "project"
edit = { "prompts/AGENTS.prompt" = "abstract agent R:\n    role: \"Test.\"\n    first: \"First\"\n        details old: \"Case\"\n            \"First case.\"\n    second: \"Second\"\n        \"Read {{details:second.old}}.\"\n        details old: \"Case\"\n            \"Second case.\"\nteam T: \"Team\"\n    home: \"t\"\n    member qa[R]: \"QA\"\n        inherit role\n        inherit second\n        drop first: \"QA owns second.\"\n    member lead[R]: \"Lead\"\n        inherit role\n        inherit first\n        drop second: \"Lead owns first.\"\n" }
args = ["build", "."]
expected_exit = 1
stderr_contains = ["E637", "`details:second.old` shares its heading with another in `_details/r.md`. Give it a title of its own."]

