schema_version = 1
default_prompt = "prompts/AGENTS.prompt"

[[cases]]
name = "load lists homes by headroom"
status = "active"
kind = "cli_contract"
project = "project_warn"
args = ["load"]
expected_exit = 0
setup = [["build", "."]]
expected_stdout_lines = [
  "Home               Runtime  Load   Limit  Headroom",
  "pods/growth/big    codex    1,205  800    -405",
  "pods/growth/big    claude   1,305  1,000  -305",
  "pods/growth/small  codex    514    800    286",
  "pods/growth/small  claude   614    1,000  386",
  "pods/growth        codex    283    800    517",
  "pods/growth        claude   383    1,000  617",
]

[[cases]]
name = "one home prints its files and its biggest parts"
status = "active"
kind = "cli_contract"
project = "project_warn"
args = ["load", "pods/growth/small"]
expected_exit = 0
setup = [["build", "."]]
expected_stdout_lines = [
  "pods/growth/small on claude: 614 of 1,000 characters, 386 left",
  "",
  "Files:",
  "  not-here.md                  100  reserved",
  "  pods/growth/AGENTS.md        283",
  "  pods/growth/small/AGENTS.md  231",
  "",
  "Biggest parts:",
  "  GrowthPod: 10",
  "  GrowthPod.small: 6",
  "",
  "pods/growth/small on codex: 514 of 800 bytes, 286 left",
  "",
  "Files:",
  "  pods/growth/AGENTS.md        283",
  "  pods/growth/small/AGENTS.md  231",
  "",
  "Biggest parts:",
  "  GrowthPod: 10",
  "  GrowthPod.small: 6",
]

[[cases]]
name = "build rejects an over-budget home"
status = "active"
kind = "cli_contract"
project = "project"
args = ["build", "."]
expected_exit = 1
absent_files = ["pods/growth/AGENTS.md"]
stderr_contains = [
  "E630",
]

[[cases]]
name = "check fails an over-budget home and names the biggest parts"
status = "active"
kind = "cli_contract"
project = "project"
args = ["check"]
expected_exit = 1
stderr_contains = [
  "E630",
  "Over load budget",
  "pods/growth/big loads",
  "Biggest parts",
]

[[cases]]
name = "a team budget tightens the limit"
status = "active"
kind = "cli_contract"
project = "project_team_budget"
args = ["check"]
expected_exit = 1
stderr_contains = [
  "E630",
  "on claude",
]

[[cases]]
name = "a budget past the runtime limit fails loud"
status = "active"
kind = "cli_contract"
project = "project_bad_budget"
args = ["check"]
expected_exit = 1
stderr_contains = [
  "E631",
]

[[cases]]
name = "load says when a home has no file for a runtime"
status = "active"
kind = "cli_contract"
project = "project_plain_agent"
args = ["load", "--target", "homes"]
expected_exit = 0
setup = [["build", "--target", "homes"]]
expected_stdout_lines = [
  "Home   Runtime  Load     Limit    Headroom",
  "pair   codex    139      32,768   32,629",
  "solo   codex    124      32,768   32,644",
  "empty  codex    no file  32,768   32,768",
  "pair   claude   139      150,000  149,861",
  "solo   claude   124      150,000  149,876",
  "empty  claude   no file  150,000  150,000",
]

[[cases]]
name = "one plain agent on claude shows its load"
status = "active"
kind = "cli_contract"
project = "project_plain_agent"
args = ["load", "solo", "--target", "homes", "--runtime", "claude"]
expected_exit = 0
setup = [["build", "--target", "homes"]]
expected_stdout_lines = [
  "solo on claude: 124 of 150,000 characters, 149,876 left",
  "",
  "Files:",
  "  solo/AGENTS.md  124",
  "",
  "Biggest parts:",
  "  Solo: 11",
]

[[cases]]
name = "a team with no text reports no Claude file"
status = "active"
kind = "cli_contract"
project = "project_plain_agent"
args = ["load", "empty", "--target", "homes", "--runtime", "claude"]
expected_exit = 0
setup = [["build", "--target", "homes"]]
expected_stdout_lines = [
  "empty on claude: no CLAUDE.md here, so claude loads nothing from this home",
]

[[cases]]
name = "warn reports an over-budget home"
status = "active"
kind = "cli_contract"
project = "project_warn"
args = ["check"]
expected_exit = 0
setup = [["build", "."]]
stderr_contains = [
  "W306 over budget: pods/growth/big loads 1,305 of 1,000 on claude.",
  "W306 over budget: pods/growth/big loads 1,205 of 800 on codex.",
]

[[cases]]
name = "warn lets an over-budget home build"
status = "active"
kind = "cli_contract"
project = "project_warn"
args = ["build", "."]
expected_exit = 0
stderr_contains = ["W306 over budget:"]
stdout_contains = ["built 3 homes"]
