schema_version = 1
default_prompt = "prompts/AGENTS.prompt"

[[cases]]
name = "load lists homes by headroom"
status = "active"
kind = "cli_contract"
project = "project"
args = ["load"]
expected_exit = 0
setup = [["build", "."]]
expected_stdout_lines = [
  "Home               Runtime  Load   Limit  Headroom",
  "pods/growth/big    codex    935    800    -135",
  "pods/growth/big    claude   1,035  1,000  -35",
  "pods/growth/small  codex    242    800    558",
  "pods/growth/small  claude   342    1,000  658",
  "pods/growth        codex    123    800    677",
  "pods/growth        claude   223    1,000  777",
]

[[cases]]
name = "one home prints its files and its biggest parts"
status = "active"
kind = "cli_contract"
project = "project"
args = ["load", "pods/growth/small"]
expected_exit = 0
setup = [["build", "."]]
expected_stdout_lines = [
  "pods/growth/small on claude: 342 of 1,000 characters, 658 left",
  "",
  "Files:",
  "  not-here.md                  100  reserved",
  "  pods/growth/AGENTS.md        123",
  "  pods/growth/small/AGENTS.md  119",
  "",
  "Biggest parts:",
  "  GrowthPod: 10",
  "  GrowthPod.small: 6",
  "",
  "pods/growth/small on codex: 242 of 800 bytes, 558 left",
  "",
  "Files:",
  "  pods/growth/AGENTS.md        123",
  "  pods/growth/small/AGENTS.md  119",
  "",
  "Biggest parts:",
  "  GrowthPod: 10",
  "  GrowthPod.small: 6",
]

[[cases]]
name = "build writes an over-budget home and warns"
status = "active"
kind = "cli_contract"
project = "project"
args = ["build", "."]
expected_exit = 0
stdout_contains = [
  "built 3 homes",
]
stderr_contains = [
  "W306",
]

[[cases]]
name = "check fails an over-budget home and names the biggest parts"
status = "active"
kind = "cli_contract"
project = "project"
args = ["check"]
expected_exit = 1
setup = [["build", "."]]
stderr_contains = [
  "E630",
  "Over load budget",
  "pods/growth/big loads",
  "Biggest parts",
]

[[cases]]
name = "a team budget tightens the limit"
status = "active"
kind = "cli_contract"
project = "project_team_budget"
args = ["check"]
expected_exit = 1
stderr_contains = [
  "E630",
  "on claude",
]

[[cases]]
name = "a budget past the runtime limit fails loud"
status = "active"
kind = "cli_contract"
project = "project_bad_budget"
args = ["check"]
expected_exit = 1
stderr_contains = [
  "E631",
]

[[cases]]
name = "load says when a home has no file for a runtime"
status = "active"
kind = "cli_contract"
project = "project_plain_agent"
args = ["load", "--target", "homes"]
expected_exit = 0
setup = [["build", "--target", "homes"]]
expected_stdout_lines = [
  "Home  Runtime  Load     Limit    Headroom",
  "pair  codex    139      32,768   32,629",
  "solo  codex    124      32,768   32,644",
  "pair  claude   no file  150,000  150,000",
  "solo  claude   no file  150,000  150,000",
]

[[cases]]
name = "one plain agent on claude prints no false load"
status = "active"
kind = "cli_contract"
project = "project_plain_agent"
args = ["load", "solo", "--target", "homes", "--runtime", "claude"]
expected_exit = 0
setup = [["build", "--target", "homes"]]
expected_stdout_lines = [
  "solo on claude: no CLAUDE.md here, so claude loads nothing from this home",
]

[[cases]]
name = "warn reports an over-budget home"
status = "active"
kind = "cli_contract"
project = "project_warn"
args = ["check"]
expected_exit = 0
stderr_contains = [
  "W306 over budget: pods/growth/big loads 1,035 of 1,000 on claude.",
  "W306 over budget: pods/growth/big loads 935 of 800 on codex.",
]
