schema_version = 1
default_prompt = "project/prompts/AGENTS.prompt"

[[cases]]
name = "the company builds its homes"
status = "active"
kind = "cli_contract"
project = "project"
args = ["build", "."]
expected_exit = 0
stdout_contains = ["built 8 homes"]
expected_file_lines = { "AGENTS.md" = [
  "## Principles", "", "Read first: @shared/handbook.md",
